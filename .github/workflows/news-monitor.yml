# ============================================================
# NEWS MONITOR — GitHub Actions Workflow
# ============================================================
# Architettura HA (High Availability):
#   JOB 1  deploy  → deploya Edge Function fetch-primary-news
#   JOB 2  invoke  → chiama la funzione con X-Cron-Secret
#   JOB 3  notify  → alert se deploy o invoke fallisce
#
# Segreti GitHub da configurare:
#   Settings → Secrets and variables → Actions → New repository secret
#
#   SUPABASE_ACCESS_TOKEN  → supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_REF   → Project Settings → General (16 char)
#   SUPABASE_ANON_KEY      → Dashboard → Settings → API → anon public
#   CRON_SECRET            → openssl rand -hex 32
#   SLACK_WEBHOOK_URL      → opzionale, Slack Incoming Webhooks
# ============================================================

name: "📰 News Monitor — Fetch & Ingest"

on:
  schedule:
    # Lunedì 07:00 UTC = 09:00 CEST
    - cron: '0 7 * * 1'
    # Giovedì 07:00 UTC = 09:00 CEST (copertura bisettimanale)
    - cron: '0 7 * * 4'
  workflow_dispatch:
    inputs:
      force_refresh:
        description: 'Forza refresh anche su fonti già visitate oggi'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      dry_run:
        description: 'Dry run: fetcha ma NON scrive su Supabase'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  # Evita runs paralleli che corrompono l'ingest
  group: news-monitor-${{ github.ref }}
  cancel-in-progress: false

jobs:

  # ─────────────────────────────────────────────────────────
  # JOB 1: Deploy Edge Function
  # ─────────────────────────────────────────────────────────
  deploy:
    name: "🚀 Deploy Edge Function"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link progetto Supabase
        run: |
          supabase link --project-ref $SUPABASE_PROJECT_REF

      - name: Deploy fetch-primary-news
        run: |
          supabase functions deploy fetch-primary-news \
            --project-ref $SUPABASE_PROJECT_REF

      - name: ✅ Conferma deploy
        run: |
          echo "Edge Function deployata con successo"
          echo "Endpoint: https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/fetch-primary-news"

  # ─────────────────────────────────────────────────────────
  # JOB 2: Invoke Edge Function
  # needs: deploy → se deploy fallisce, questo job NON parte
  # ─────────────────────────────────────────────────────────
  invoke:
    name: "📡 Invoke News Fetcher"
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 15
    env:
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}

    steps:
      - name: Invoca Edge Function
        id: invoke
        run: |
          FUNCTION_URL="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/fetch-primary-news"
          FORCE_REFRESH="${{ github.event.inputs.force_refresh || 'false' }}"
          DRY_RUN="${{ github.event.inputs.dry_run || 'false' }}"

          echo "🌐 Endpoint: $FUNCTION_URL"
          echo "⚙️  force_refresh=$FORCE_REFRESH | dry_run=$DRY_RUN"

          HTTP_RESPONSE=$(curl \
            --silent \
            --write-out "\n__STATUS__%{http_code}" \
            --max-time 120 \
            --retry 3 \
            --retry-delay 10 \
            --retry-all-errors \
            -X POST "$FUNCTION_URL" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Content-Type: application/json" \
            -H "X-Cron-Secret: ${CRON_SECRET}" \
            -d "{\"triggered_by\": \"${{ github.event_name }}\", \"force_refresh\": $FORCE_REFRESH, \"dry_run\": $DRY_RUN}")

          HTTP_BODY=$(echo "$HTTP_RESPONSE" | sed -e 's/__STATUS__[0-9]*//')
          HTTP_STATUS=$(echo "$HTTP_RESPONSE" | grep -o '__STATUS__[0-9]*' | grep -o '[0-9]*')

          echo "📊 HTTP Status: $HTTP_STATUS"
          echo "📋 Response:"
          echo "$HTTP_BODY" | python3 -m json.tool 2>/dev/null || echo "$HTTP_BODY"

          echo "http_status=$HTTP_STATUS" >> $GITHUB_OUTPUT
          echo "http_body<<EOF" >> $GITHUB_OUTPUT
          echo "$HTTP_BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          # Fallisci esplicitamente se risposta non 2xx
          if [[ "$HTTP_STATUS" -lt 200 ]] || [[ "$HTTP_STATUS" -ge 300 ]]; then
            echo "::error::Edge Function ha risposto HTTP $HTTP_STATUS — controlla i log Supabase"
            exit 1
          fi

      - name: 📊 Summary risultati ingest
        if: success()
        run: |
          HTTP_BODY='${{ steps.invoke.outputs.http_body }}'

          FETCHED=$(echo "$HTTP_BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('items_fetched', d.get('fetched', 'N/A')))" 2>/dev/null || echo 'N/A')
          INSERTED=$(echo "$HTTP_BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('items_inserted', d.get('inserted', 'N/A')))" 2>/dev/null || echo 'N/A')
          DUPES=$(echo "$HTTP_BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('items_duplicate', d.get('duplicates', 'N/A')))" 2>/dev/null || echo 'N/A')
          ERRORS=$(echo "$HTTP_BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('errors', 'N/A'))" 2>/dev/null || echo 'N/A')

          echo "::notice::📰 Fetchati: $FETCHED | ✅ Inseriti: $INSERTED | 🔁 Duplicati: $DUPES | ❌ Errori: $ERRORS"

          {
            echo "## 📰 News Monitor — Risultati Ingest"
            echo ""
            echo "| Metrica | Valore |"
            echo "|---|---|"
            echo "| 🌐 Articoli fetchati | $FETCHED |"
            echo "| ✅ Inseriti (DRAFT) | $INSERTED |"
            echo "| 🔁 Duplicati saltati | $DUPES |"
            echo "| ❌ Errori fonti | $ERRORS |"
            echo "| 🕐 Timestamp UTC | $(date -u +%Y-%m-%dT%H:%M:%SZ) |"
            echo "| 🔧 Trigger | ${{ github.event_name }} |"
          } >> $GITHUB_STEP_SUMMARY

  # ─────────────────────────────────────────────────────────
  # JOB 3: Notifica Failure
  # Gira SOLO se deploy o invoke falliscono
  # ─────────────────────────────────────────────────────────
  notify-failure:
    name: "🚨 Notifica Failure"
    runs-on: ubuntu-latest
    needs: [deploy, invoke]
    if: failure()
    timeout-minutes: 5

    steps:
      - name: Annota failure su GitHub
        run: |
          echo "::error title=News Monitor Fallito::Workflow fallito alle $(date -u +%Y-%m-%dT%H:%M:%SZ). Controlla i log."
          {
            echo "## ❌ News Monitor — FAILURE"
            echo ""
            echo "Il workflow è fallito alle **$(date -u +%Y-%m-%dT%H:%M:%SZ)** UTC."
            echo ""
            echo "➡️ [Vedi i log completi](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } >> $GITHUB_STEP_SUMMARY

      - name: Notifica Slack (se SLACK_WEBHOOK_URL configurato)
        if: ${{ secrets.SLACK_WEBHOOK_URL != '' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-type: application/json' \
            --data '{
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "🚨 *News Monitor Fallito!*\n*Run:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Vedi log completi>\n*Timestamp:* $(date -u +%Y-%m-%dT%H:%M:%SZ)"
                  }
                }
              ]
            }'
